name: Сборка установщика для Windows

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "models-v1"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python_desktop/requirements.txt

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r python_desktop/requirements.txt pyinstaller pillow

      - name: KaTeX для офлайн-формул
        run: python python_desktop/tools/vendor_katex.py

      - name: Офлайн-модели из релиза
        run: python python_desktop/tools/prepare_installer_models.py

      - name: Иконка
        run: |
          python -c "from PIL import Image; im = Image.open('public/logo.png').convert('RGBA'); im.save('build/axai.ico', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])"

      - name: Упаковка программы (PyInstaller)
        run: >
          pyinstaller python_desktop/main.py
          --name AxAI --noconfirm --windowed
          --icon build/axai.ico
          --add-data "python_desktop/assets;assets"
          --add-data "public/logo.png;public"
          --collect-all sherpa_onnx
          --collect-all faster_whisper
          --collect-all ctranslate2
          --collect-all av
          --collect-all sounddevice
          --collect-all onnxruntime

      - name: Проверка запуска собранной программы
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\AxAI\AxAI.exe" -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { Write-Error "Программа закрылась в первые 20 секунд (код $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id -Force

      - name: Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Сборка установщика
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ github.run_number }} python_desktop\installer\axai.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: AxAI-Setup
          path: installer_out/AxAI-Setup.exe
          compression-level: 0

      - name: Прикрепить к релизу
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag }}" installer_out/AxAI-Setup.exe --clobber
